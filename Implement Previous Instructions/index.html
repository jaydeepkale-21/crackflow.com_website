    <!-- Schema.org JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CrackFlow?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CrackFlow is a native desktop AI copilot that listens to your interview conversation in real time and provides concise, context-aware answers — without your interviewer ever knowing it's there."
          }
        },
        {
          "@type": "Question",
          "name": "How does CrackFlow work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CrackFlow captures audio from your system, transcribes the conversation, understands the question using AI, and delivers a structured response in your private overlay — all in seconds."
          }
        },
        {
          "@type": "Question",
          "name": "Does CrackFlow support coding interviews?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CrackFlow Code mode handles DSA problems, debugging, time/space complexity analysis, and system design questions on platforms like LeetCode, HackerRank, and CodeSignal."
          }
        },
        {
          "@type": "Question",
          "name": "Can CrackFlow understand my resume and job description?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CrackFlow Context lets you load your resume, project descriptions, and the job description so responses are grounded in your personal experience."
          }
        },
        {
          "@type": "Question",
          "name": "Does CrackFlow work with Zoom and Google Meet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CrackFlow works alongside any video meeting platform that runs on your desktop, including Zoom, Google Meet, Microsoft Teams, and Webex."
          }
        },
        {
          "@type": "Question",
          "name": "Is CrackFlow a browser extension?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. CrackFlow is a native desktop application, which allows it to capture system audio and maintain a private overlay separate from your browser or meeting app."
          }
        }
      ]
    }
